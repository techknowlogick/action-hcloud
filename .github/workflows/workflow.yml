name: Test and lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  package_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Ensure that code has been packaged and committed
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            echo -e "\nPlease run 'npm run package' and commit the results"
            exit 1
          fi

  # These jobs need the HCLOUD_TOKEN secret, which is not available to pull
  # requests from forks.
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install hcloud
        id: install
        uses: ./
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}

      - name: Verify installation
        shell: bash
        run: hcloud version | grep -F "${{ steps.install.outputs.version }}"

      - name: Verify token is available to later steps
        run: hcloud datacenter list

  test_custom_version:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install hcloud
        uses: ./
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}
          version: 1.40.0

      - name: Verify installation of correct version
        shell: bash
        run: hcloud version | grep -F "1.40.0"
